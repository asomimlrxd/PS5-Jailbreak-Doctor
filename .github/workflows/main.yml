
name: Build PS5 Homebrew Doctor EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python para a compilação
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Criar executável único
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PS5HomebrewDoctor `
            --distpath dist `
            --workpath build `
            --specpath build `
            --add-data "knowledge_base.json;." `
            app.py

          if (-not (Test-Path "dist/PS5HomebrewDoctor.exe")) {
            throw "O executável não foi criado."
          }

      - name: Disponibilizar o EXE
        uses: actions/upload-artifact@v4
        with:
          name: PS5HomebrewDoctor-Windows-x64
          path: dist/PS5HomebrewDoctor.exe
          if-no-files-found: error
          retention-days: 30
